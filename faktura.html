<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vystavení faktury — M&T Servis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --dark: #1a2332;
    --accent: #2c5f8a;
    --light: #f4f6f9;
    --border: #d0d7e2;
    --text: #1a2332;
    --muted: #6b7a8d;
    --green: #2a7a4b;
    --red: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--light);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== SCREEN LAYOUT ===== */
  .screen-only {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .page-header {
    background: var(--dark);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    border-radius: 6px;
  }
  .page-header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.02em; }
  .page-header .subtitle { font-size: 0.8rem; opacity: 0.6; margin-top: 2px; }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #fff; color: var(--dark); border: 1px solid var(--border); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
  }
  .card-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 14px;
  }

  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    margin-bottom: 12px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(44,95,138,0.12);
  }
  textarea { resize: vertical; min-height: 60px; }

  /* Položky */
  .polozky-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .polozky-table th {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 6px 8px;
    border-bottom: 2px solid var(--border);
    text-align: left;
  }
  .polozky-table td { padding: 6px 4px; vertical-align: middle; }
  .polozky-table input { margin-bottom: 0; }
  .polozky-table .col-popis { width: 45%; }
  .polozky-table .col-mnozstvi { width: 12%; }
  .polozky-table .col-jednotka { width: 12%; }
  .polozky-table .col-cena { width: 14%; }
  .polozky-table .col-celkem { width: 12%; text-align: right; font-weight: 600; padding-right: 8px; }
  .polozky-table .col-akce { width: 5%; text-align: center; }

  .btn-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .btn-remove:hover { color: var(--red); background: #fdecea; }

  .celkem-box {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    padding: 14px 8px;
    border-top: 2px solid var(--border);
    margin-top: 4px;
  }
  .celkem-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  .celkem-value { font-size: 1.5rem; font-weight: 700; color: var(--dark); min-width: 120px; text-align: right; }

  .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }

  /* ===== PRINT LAYOUT ===== */
  @media print {
    body { background: #fff; }
    .screen-only > *:not(#faktura-print) { display: none !important; }
    .screen-only { max-width: 100%; padding: 0; margin: 0; }
    #faktura-print { display: block !important; }
  }

  #faktura-print { display: none; }

  /* Tisková faktura */
  .print-page {
    width: 210mm;
    min-height: 297mm;
    padding: 14mm 14mm 14mm 14mm;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 9pt;
    color: #1a2332;
    position: relative;
  }

  .print-header {
    background: #1a2332;
    color: #fff;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .print-header .firma { font-size: 12pt; font-weight: 700; }
  .print-header .firma-sub { font-size: 8pt; opacity: 0.7; margin-top: 3px; }
  .print-header .faktura-cislo { text-align: right; }
  .print-header .faktura-cislo .label { font-size: 7pt; opacity: 0.6; }
  .print-header .faktura-cislo .cislo { font-size: 16pt; font-weight: 700; color: #7eb8e8; }

  .print-strany {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .print-strana-title {
    font-size: 7pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #2c5f8a;
    margin-bottom: 5px;
    border-bottom: 1px solid #d0d7e2;
    padding-bottom: 3px;
  }
  .print-strana-content { font-size: 9pt; line-height: 1.6; }
  .print-strana-content strong { display: block; font-size: 10pt; }

  .print-meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: #f4f6f9;
    padding: 8px 12px;
    border-radius: 3px;
    margin-bottom: 16px;
  }
  .print-meta-item .label { font-size: 7pt; color: #6b7a8d; font-weight: 700; text-transform: uppercase; }
  .print-meta-item .value { font-size: 9pt; font-weight: 600; }

  .print-polozky { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .print-polozky thead tr { background: #1a2332; color: #fff; }
  .print-polozky thead th { padding: 6px 8px; font-size: 7.5pt; text-align: left; font-weight: 600; }
  .print-polozky thead th:last-child { text-align: right; }
  .print-polozky tbody tr:nth-child(even) { background: #f4f6f9; }
  .print-polozky tbody td { padding: 5px 8px; font-size: 9pt; border-bottom: 1px solid #e8ecf0; }
  .print-polozky tbody td:last-child { text-align: right; font-weight: 600; }
  .print-polozky tfoot td { padding: 8px; font-weight: 700; }
  .print-polozky tfoot .celkem-row td { font-size: 11pt; border-top: 2px solid #1a2332; }
  .print-polozky tfoot .celkem-row td:last-child { text-align: right; color: #1a2332; }

  .print-footer {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: flex-start;
  }
  .print-platba { }
  .print-platba-title {
    font-size: 7pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #2c5f8a; margin-bottom: 6px;
    border-bottom: 1px solid #d0d7e2; padding-bottom: 3px;
  }
  .print-platba-row { font-size: 9pt; line-height: 1.8; }
  .print-platba-row .lb { color: #6b7a8d; display: inline-block; width: 90px; font-size: 8pt; }

  .print-poznamka {
    margin-top: 14px;
    padding: 8px 10px;
    background: #f4f6f9;
    border-left: 3px solid #2c5f8a;
    font-size: 8pt;
    color: #6b7a8d;
  }

  .print-dph-note {
    margin-top: 10px;
    font-size: 8pt;
    font-style: italic;
    color: #6b7a8d;
  }

  #print-qr { margin-top: 4px; }
  #print-qr img, #print-qr canvas { width: 90px !important; height: 90px !important; }
</style>
</head>
<body>
<div class="screen-only">

  <!-- Hlavička -->
  <div class="page-header">
    <div>
      <div class="subtitle">M&amp;T Servis</div>
      <h1>Nová faktura</h1>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" onclick="resetForm()">Vymazat</button>
      <button class="btn btn-primary" onclick="zobrazNahled()">Náhled a tisk</button>
    </div>
  </div>

  <!-- Formulář -->
  <div class="form-grid">

    <!-- Faktura info -->
    <div class="card">
      <div class="card-title">Faktura</div>
      <label>Číslo faktury</label>
      <input type="text" id="cislo" placeholder="např. 2026006">
      <label>Datum vystavení</label>
      <input type="date" id="datum">
      <label>Datum splatnosti</label>
      <input type="date" id="splatnost">
      <label>Forma úhrady</label>
      <select id="forma">
        <option value="Převodem">Převodem</option>
        <option value="Hotově">Hotově</option>
        <option value="Kartou">Kartou</option>
      </select>
    </div>

    <!-- Odběratel -->
    <div class="card">
      <div class="card-title">Odběratel</div>
      <label>Název / Jméno</label>
      <input type="text" id="odberatel_nazev" placeholder="Firma s.r.o. nebo Jan Novák">
      <label>IČO (nepovinné)</label>
      <input type="text" id="odberatel_ico" placeholder="12345678">
      <label>Adresa</label>
      <textarea id="odberatel_adresa" placeholder="Ulice 1&#10;123 45 Město"></textarea>
    </div>

  </div>

  <!-- Položky -->
  <div class="card" style="margin-bottom:20px;">
    <div class="card-title">Položky</div>
    <table class="polozky-table">
      <thead>
        <tr>
          <th class="col-popis">Popis</th>
          <th class="col-mnozstvi">Množství</th>
          <th class="col-jednotka">Jednotka</th>
          <th class="col-cena">Cena/j (Kč)</th>
          <th class="col-celkem">Celkem</th>
          <th class="col-akce"></th>
        </tr>
      </thead>
      <tbody id="polozky-body"></tbody>
    </table>
    <div class="celkem-box">
      <span class="celkem-label">Celkem k úhradě:</span>
      <span class="celkem-value" id="celkem-display">0 Kč</span>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="pridatPolozku()">+ Přidat položku</button>
  </div>

  <!-- Poznámka -->
  <div class="card" style="margin-bottom:20px;">
    <div class="card-title">Poznámka (nepovinné)</div>
    <textarea id="poznamka" placeholder="Volitelná poznámka na faktuře..."></textarea>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="resetForm()">Vymazat formulář</button>
    <button class="btn btn-primary" onclick="zobrazNahled()">📄 Náhled a tisk</button>
  </div>

</div><!-- /screen-only -->

<!-- Tisková faktura (skrytá na obrazovce) -->
<div id="faktura-print">
  <div class="print-page" id="print-content"></div>
</div>

<script>
// ===== DODAVATEL (napevno) =====
const DODAVATEL = {
  nazev: 'Tomáš Skopalík',
  ico: '08134235',
  adresa: 'Šumvaldská 59\n783 86 Dlouhá Loučka',
  ucet: '363170017/0300',
  iban: 'CZ5503000000003631700170',
  telefon: '',
  email: '',
};

// ===== INICIALIZACE =====
let polozky = [];

function init() {
  // Dnešní datum
  const dnes = new Date();
  document.getElementById('datum').value = formatDateInput(dnes);
  // Splatnost +14 dní
  const splatnost = new Date(dnes);
  splatnost.setDate(splatnost.getDate() + 14);
  document.getElementById('splatnost').value = formatDateInput(splatnost);
  // Jedna prázdná položka
  pridatPolozku();
}

function formatDateInput(d) {
  return d.toISOString().split('T')[0];
}

function formatDateCZ(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  return `${d}. ${m}. ${y}`;
}

// ===== POLOŽKY =====
function pridatPolozku() {
  polozky.push({ popis: '', mnozstvi: 1, jednotka: 'ks', cena: 0 });
  renderPolozky();
}

function odebratiPolozku(idx) {
  polozky.splice(idx, 1);
  if (polozky.length === 0) pridatPolozku();
  else renderPolozky();
}

function updatePolozka(idx, field, value) {
  polozky[idx][field] = field === 'mnozstvi' || field === 'cena' ? parseFloat(value) || 0 : value;
  renderCelkem();
}

function renderPolozky() {
  const tbody = document.getElementById('polozky-body');
  tbody.innerHTML = polozky.map((p, i) => `
    <tr>
      <td class="col-popis">
        <input type="text" value="${escHtml(p.popis)}" placeholder="Popis služby nebo zboží"
          oninput="updatePolozka(${i},'popis',this.value)">
      </td>
      <td class="col-mnozstvi">
        <input type="number" value="${p.mnozstvi}" min="0" step="0.01"
          oninput="updatePolozka(${i},'mnozstvi',this.value)" style="text-align:right;">
      </td>
      <td class="col-jednotka">
        <input type="text" value="${escHtml(p.jednotka)}" placeholder="ks"
          oninput="updatePolozka(${i},'jednotka',this.value)">
      </td>
      <td class="col-cena">
        <input type="number" value="${p.cena}" min="0" step="0.01"
          oninput="updatePolozka(${i},'cena',this.value)" style="text-align:right;">
      </td>
      <td class="col-celkem">${formatKc(p.mnozstvi * p.cena)}</td>
      <td class="col-akce">
        <button class="btn-remove" onclick="odebratiPolozku(${i})" title="Odebrat">×</button>
      </td>
    </tr>
  `).join('');
  renderCelkem();
}

function renderCelkem() {
  // Přepočítat součty v tabulce
  const tbody = document.getElementById('polozky-body');
  const rows = tbody.querySelectorAll('tr');
  polozky.forEach((p, i) => {
    const celkemCell = rows[i]?.querySelector('.col-celkem');
    if (celkemCell) celkemCell.textContent = formatKc(p.mnozstvi * p.cena);
  });
  const total = celkem();
  document.getElementById('celkem-display').textContent = formatKcFull(total);
}

function celkem() {
  return polozky.reduce((s, p) => s + (p.mnozstvi * p.cena), 0);
}

function formatKc(n) {
  return n.toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kč';
}
function formatKcFull(n) {
  return n.toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kč';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== RESET =====
function resetForm() {
  if (!confirm('Vymazat celý formulář?')) return;
  document.getElementById('cislo').value = '';
  document.getElementById('odberatel_nazev').value = '';
  document.getElementById('odberatel_ico').value = '';
  document.getElementById('odberatel_adresa').value = '';
  document.getElementById('poznamka').value = '';
  polozky = [];
  init();
}

// ===== NÁHLED A TISK =====
function zobrazNahled() {
  const cislo = document.getElementById('cislo').value.trim();
  if (!cislo) { alert('Zadej číslo faktury.'); document.getElementById('cislo').focus(); return; }
  const nazev = document.getElementById('odberatel_nazev').value.trim();
  if (!nazev) { alert('Zadej název odběratele.'); document.getElementById('odberatel_nazev').focus(); return; }
  if (celkem() <= 0) { alert('Faktura nemá žádné položky s cenou.'); return; }

  generujPrint();
  window.print();
}

function generujPrint() {
  const cislo = document.getElementById('cislo').value.trim();
  const datum = document.getElementById('datum').value;
  const splatnost = document.getElementById('splatnost').value;
  const forma = document.getElementById('forma').value;
  const nazev = document.getElementById('odberatel_nazev').value.trim();
  const ico = document.getElementById('odberatel_ico').value.trim();
  const adresa = document.getElementById('odberatel_adresa').value.trim();
  const poznamka = document.getElementById('poznamka').value.trim();
  const total = celkem();

  // Variabilní symbol = číslo faktury (jen číslice)
  const vs = cislo.replace(/\D/g, '');

  // SPD QR string
  const qrString = `SPD*1.0*ACC:${DODAVATEL.iban}*AM:${total.toFixed(2)}*CC:CZK*X-VS:${vs}*MSG:Faktura ${cislo}`;

  const adresaDodavatel = DODAVATEL.adresa.split('\n').join('<br>');
  const adresaOdberatel = adresa.split('\n').join('<br>');

  const polozkyHTML = polozky.filter(p => p.popis || p.cena > 0).map((p, i) => `
    <tr>
      <td>${i + 1}.</td>
      <td>${escHtml(p.popis)}</td>
      <td style="text-align:right">${p.mnozstvi}</td>
      <td>${escHtml(p.jednotka)}</td>
      <td style="text-align:right">${p.cena.toLocaleString('cs-CZ', {minimumFractionDigits:2})} Kč</td>
      <td>${formatKc(p.mnozstvi * p.cena)}</td>
    </tr>
  `).join('');

  const html = `
    <div class="print-header">
      <div>
        <div class="firma">${escHtml(DODAVATEL.nazev)}</div>
        <div class="firma-sub">IČO: ${DODAVATEL.ico} &nbsp;|&nbsp; ${DODAVATEL.adresa.replace('\n', ', ')}</div>
      </div>
      <div class="faktura-cislo">
        <div class="label">FAKTURA</div>
        <div class="cislo">${escHtml(cislo)}</div>
      </div>
    </div>

    <div class="print-strany">
      <div>
        <div class="print-strana-title">Dodavatel</div>
        <div class="print-strana-content">
          <strong>${escHtml(DODAVATEL.nazev)}</strong>
          ${adresaDodavatel}<br>
          IČO: ${DODAVATEL.ico}
        </div>
      </div>
      <div>
        <div class="print-strana-title">Odběratel</div>
        <div class="print-strana-content">
          <strong>${escHtml(nazev)}</strong>
          ${adresaOdberatel ? adresaOdberatel + '<br>' : ''}
          ${ico ? 'IČO: ' + escHtml(ico) : ''}
        </div>
      </div>
    </div>

    <div class="print-meta">
      <div class="print-meta-item">
        <div class="label">Datum vystavení</div>
        <div class="value">${formatDateCZ(datum)}</div>
      </div>
      <div class="print-meta-item">
        <div class="label">Datum splatnosti</div>
        <div class="value">${formatDateCZ(splatnost)}</div>
      </div>
      <div class="print-meta-item">
        <div class="label">Forma úhrady</div>
        <div class="value">${escHtml(forma)}</div>
      </div>
      <div class="print-meta-item">
        <div class="label">Variabilní symbol</div>
        <div class="value">${vs}</div>
      </div>
    </div>

    <table class="print-polozky">
      <thead>
        <tr>
          <th style="width:4%">#</th>
          <th style="width:45%">Popis</th>
          <th style="width:9%;text-align:right">Množství</th>
          <th style="width:8%">Jedn.</th>
          <th style="width:14%;text-align:right">Cena/j</th>
          <th style="width:16%;text-align:right">Celkem</th>
        </tr>
      </thead>
      <tbody>${polozkyHTML}</tbody>
      <tfoot>
        <tr class="celkem-row">
          <td colspan="5" style="text-align:right;padding-right:12px;">Celkem k úhradě:</td>
          <td style="text-align:right;font-size:12pt;">${formatKcFull(total)}</td>
        </tr>
      </tfoot>
    </table>

    <div class="print-footer">
      <div class="print-platba">
        <div class="print-platba-title">Platební údaje</div>
        <div class="print-platba-row"><span class="lb">Číslo účtu:</span> ${DODAVATEL.ucet}</div>
        <div class="print-platba-row"><span class="lb">IBAN:</span> ${DODAVATEL.iban}</div>
        <div class="print-platba-row"><span class="lb">Var. symbol:</span> ${vs}</div>
        <div class="print-platba-row"><span class="lb">Částka:</span> <strong>${formatKcFull(total)}</strong></div>
      </div>
      <div>
        <div class="print-platba-title">QR platba</div>
        <div id="print-qr"></div>
      </div>
    </div>

    ${poznamka ? `<div class="print-poznamka">${escHtml(poznamka)}</div>` : ''}
    <div class="print-dph-note">Nejsem plátce DPH.</div>
  `;

  document.getElementById('print-content').innerHTML = html;

  // Vygenerovat QR kód
  setTimeout(() => {
    const qrEl = document.getElementById('print-qr');
    if (qrEl) {
      qrEl.innerHTML = '';
      new QRCode(qrEl, {
        text: qrString,
        width: 90,
        height: 90,
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }, 50);
}

// ===== START =====
init();
</script>
