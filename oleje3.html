<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Výměna oleje – rezervace – M&T Servis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#2563eb;--blue-dark:#1d4ed8;--blue-light:#eff6ff;--blue-mid:#bfdbfe;
    --text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;
    --bg:#f8fafc;--white:#ffffff;--green:#16a34a;--green-light:#f0fdf4;--green-border:#bbf7d0;
    --red:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;min-height:100vh;padding:20px 10px;line-height:1.5;}
  .container{max-width:600px;margin:0 auto;}
  header{text-align:center;margin-bottom:30px;}
  h1{font-size:24px;font-weight:700;margin-bottom:8px;color:#0f172a;}
  .subtitle{color:var(--text-muted);font-size:15px;}
  .card{background:var(--white);border-radius:16px;border:1px solid var(--border);box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);padding:24px;margin-bottom:20px;}
  .card.hidden{display:none;}
  .step-indicator{display:flex;justify-content:space-between;margin-bottom:24px;padding:0 10px;}
  .step{width:32px;height:32px;border-radius:50%;background:var(--white);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--text-muted);}
  .step.active{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
  .step.done{background:var(--blue);border-color:var(--blue);color:var(--white);}
  .form-group{margin-bottom:20px;}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#334155;}
  input[type="text"],input[type="tel"],input[type="email"],textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:#fff;}
  .btn-primary, .submit-btn {width:100%;background:var(--blue);color:var(--white);border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary:disabled {opacity:0.6;}
  .error-msg{color:var(--red);font-size:14px;margin-top:8px;display:none;background:#fef2f2;padding:10px;border-radius:6px;border:1px solid #fee2e2;}
  .error-msg.visible{display:block;}
  .car-info-box{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:12px;padding:16px;margin-bottom:24px;}
  .service-item{display:flex;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;}
  .service-item.selected{border-color:var(--blue);background:var(--blue-light);}
  .service-checkbox{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);margin-right:12px;display:flex;align-items:center;justify-content:center;}
  .service-item.selected .service-checkbox{background:var(--blue);border-color:var(--blue);}
  .service-checkbox::after{content:"✓";color:white;font-size:12px;display:none;}
  .service-item.selected .service-checkbox::after{display:block;}
  footer{text-align:center;margin-top:40px;color:var(--text-muted);font-size:13px;}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Výměna oleje</h1>
    <div class="subtitle">Rezervace termínu v M&T Servisu</div>
  </header>

  <div class="step-indicator">
    <div class="step active" id="s1">1</div>
    <div class="step" id="s2">2</div>
    <div class="step" id="s3">3</div>
    <div class="step" id="s4">4</div>
  </div>

  <div id="cardVin" class="card">
    <div class="form-group">
      <label for="vin">VIN kód vozidla (17 znaků)</label>
      <div style="display: flex; gap: 8px; align-items: flex-start;">
        <input type="text" id="vin" placeholder="TMB..." maxlength="17" style="text-transform: uppercase; flex: 1; margin-bottom: 0;">
        
        <label for="vin-camera" title="Vyfotit VIN" style="cursor: pointer; background: var(--blue); color: white; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; height: 46px; width: 48px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <input type="file" id="vin-camera" accept="image/*" capture="environment" style="display: none;">
        </label>

        <label for="vin-gallery" title="Vybrat z galerie" style="cursor: pointer; background: var(--blue); color: white; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; height: 46px; width: 48px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <input type="file" id="vin-gallery" accept="image/*" style="display: none;">
        </label>
      </div>
      <p id="vin-status" style="font-size: 12px; margin-top: 5px; color: var(--blue); display: none; font-weight: 500;"></p>
      <div id="vinErr" class="error-msg"></div>
    </div>
    <button class="btn-primary" onclick="checkVIN()">Pokračovat</button>
  </div>

  <div id="cardSluzby" class="card hidden">
    <div class="car-info-box">
      <div style="font-weight:700; font-size:18px; color:var(--blue-dark);" id="displayAuto">Načítám...</div>
      <div style="font-size:14px;" id="displayMotor">-</div>
      <div style="font-size:12px; color:var(--text-muted);" id="displayVin">-</div>
    </div>
    <label>Vyberte úkony:</label>
    <div class="service-item selected" onclick="toggleService('olej')">
      <div class="service-checkbox"></div><div class="service-name">Výměna oleje a filtru</div>
    </div>
    <div class="service-item" onclick="toggleService('vzduch')">
      <div class="service-checkbox"></div><div class="service-name">Vzduchový filtr</div>
    </div>
    <div class="service-item" onclick="toggleService('kabina')">
      <div class="service-checkbox"></div><div class="service-name">Kabinový filtr</div>
    </div>
    <div style="margin-top:20px; font-weight:700; color:var(--blue); font-size:22px; text-align:right;" id="totalCena">počítám...</div>
    <button class="btn-primary" onclick="goStep3()" style="margin-top:20px;">Pokračovat</button>
  </div>

  <div id="cardKontakt" class="card hidden">
    <div class="form-group"><label>Jméno</label><input type="text" id="jmeno" placeholder="Jan Novák"></div>
    <div class="form-group"><label>Telefon</label><input type="tel" id="telefon" placeholder="+420..."></div>
    <div class="form-group"><label>Poznámka</label><textarea id="poznamka" rows="3"></textarea></div>
    <button class="submit-btn" onclick="odeslatRezervaci()">Odeslat rezervaci</button>
  </div>

  <div id="cardHotovo" class="card hidden" style="text-align:center;">
    <div class="success-icon" style="font-size: 40px; color: var(--green); margin-bottom: 15px;">✓</div>
    <h2>Odesláno!</h2>
    <p>Ozveme se vám pro potvrzení termínu.</p>
    <button class="btn-primary" onclick="location.reload()" style="margin-top:20px;">Nová rezervace</button>
  </div>

  <footer>&copy; 2024 M&T Servis</footer>
</div>

<script>
// --- KONFIGURACE (ZDE POUŽIJ SVOU FUNKČNÍ ADRESU) ---
var OLEJE_API = 'https://script.google.com/macros/s/AKfycbyI7G4m72D_K8K7H_oU12345/exec';
const VISION_API_KEY = 'AIzaSyDngFtfxDub3SR5zOrMYYbWw-z7B8lEsCw';

var stav = { vin: '', znacka: '', model: '', palivo: '', objem: '', kodMotoru: '', sluzby: { olej: true, vzduch: false, kabina: false }, cenaCelkem: 0 };

// --- SPOLEČNÁ FUNKCE PRO ZPRACOVÁNÍ OBRÁZKU ---
async function procesujObrazek(e) {
  const file = e.target.files[0]; if (!file) return;
  const status = document.getElementById('vin-status');
  const vinInput = document.getElementById('vin');
  
  status.style.display = 'block';
  status.style.color = 'var(--blue)';
  status.textContent = 'Analyzuji obrázek...';
  
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = async () => {
    const base64 = reader.result.split(',')[1];
    try {
      const res = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${VISION_API_KEY}`, {
        method: 'POST',
        body: JSON.stringify({ requests: [{ image: { content: base64 }, features: [{ type: 'TEXT_DETECTION' }] }] })
      });
      const data = await res.json();
      const text = data.responses[0]?.fullTextAnnotation?.text || "";
      const found = text.replace(/\s/g, '').match(/[A-HJ-NPR-Z0-9]{17}/);
      
      if (found) {
        vinInput.value = found[0];
        status.textContent = 'VIN načten!';
        status.style.color = 'var(--green)';
        setTimeout(checkVIN, 500);
      } else {
        status.textContent = 'VIN nenalezen. Zkuste jinou fotku.';
        status.style.color = 'var(--red)';
      }
    } catch (err) { status.textContent = 'Chyba připojení.'; }
    setTimeout(() => { status.style.display = 'none'; }, 4000);
  };
}

document.getElementById('vin-camera').addEventListener('change', procesujObrazek);
document.getElementById('vin-gallery').addEventListener('change', procesujObrazek);

// --- FUNKCE PRO PROPOJENÍ ---
function checkVIN() {
  var vin = document.getElementById('vin').value.trim().toUpperCase();
  if (vin.length !== 17) { alert('VIN musí mít 17 znaků'); return; }
  
  var btn = document.querySelector('#cardVin .btn-primary');
  btn.disabled = true; btn.textContent = 'Hledám auto...';

  fetch(OLEJE_API + '?akce=getAuto&vin=' + vin)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'success') {
        stav.vin = vin; stav.znacka = data.znacka; stav.model = data.model;
        stav.objem = data.objem; stav.kodMotoru = data.kodMotoru;
        document.getElementById('displayAuto').textContent = stav.znacka + ' ' + stav.model;
        document.getElementById('displayMotor').textContent = stav.objem + ' (' + stav.kodMotoru + ')';
        document.getElementById('displayVin').textContent = 'VIN: ' + stav.vin;
        document.getElementById('cardVin').classList.add('hidden');
        document.getElementById('cardSluzby').classList.remove('hidden');
        calculatePrice(); updateSteps(2);
      } else { alert('Auto nenalezeno'); btn.disabled = false; btn.textContent = 'Pokračovat'; }
    });
}

function toggleService(id) {
  stav.sluzby[id] = !stav.sluzby[id];
  const items = document.querySelectorAll('.service-item');
  const ids = ['olej','vzduch','kabina'];
  items[ids.indexOf(id)].classList.toggle('selected');
  calculatePrice();
}

function calculatePrice() {
  fetch(OLEJE_API + '?akce=getCena&vin=' + stav.vin)
    .then(r => r.json())
    .then(data => {
      let total = data.cena || 2500;
      if (stav.sluzby.vzduch) total += 600;
      if (stav.sluzby.kabina) total += 500;
      stav.cenaCelkem = total;
      document.getElementById('totalCena').textContent = total + ' Kč';
    });
}

function goStep3() {
  document.getElementById('cardSluzby').classList.add('hidden');
  document.getElementById('cardKontakt').classList.remove('hidden');
  updateSteps(3);
}

function odeslatRezervaci() {
  const jmeno = document.getElementById('jmeno').value;
  const tel = document.getElementById('telefon').value;
  if(!jmeno || !tel) { alert('Vyplňte prosím jméno a telefon.'); return; }
  
  const btn = document.querySelector('.submit-btn');
  btn.textContent = 'Odesílám...'; btn.disabled = true;

  fetch(OLEJE_API, {
    method: 'POST',
    body: JSON.stringify({
      akce: 'rezervace', jmeno: jmeno, telefon: tel, vin: stav.vin,
      auto: stav.znacka + ' ' + stav.model, cena: stav.cenaCelkem
    })
  }).then(() => {
    document.getElementById('cardKontakt').classList.add('hidden');
    document.getElementById('cardHotovo').classList.remove('hidden');
    updateSteps(4);
  });
}

function updateSteps(n) {
  for(let i=1; i<=4; i++) {
    const s = document.getElementById('s'+i);
    s.className = 'step' + (i<n ? ' done' : (i===n ? ' active' : ''));
  }
}
</script>
</body>
</html>
