<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Výměna oleje – rezervace – M&T Servis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#2563eb;--blue-dark:#1d4ed8;--blue-light:#eff6ff;--blue-mid:#bfdbfe;
    --text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;
    --bg:#f8fafc;--white:#ffffff;--green:#16a34a;--green-light:#f0fdf4;--green-border:#bbf7d0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;min-height:100vh;}
  .header{background:#fff;padding:12px 20px;display:table;width:100%;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-bottom:2px solid var(--blue-mid);}
  .header-text{display:table-cell;vertical-align:middle;width:100%;}
  .header-sub{font-size:19px;font-weight:700;color:var(--text);}
  .header-sub-small{font-size:11px;font-weight:500;color:var(--text-muted);}
  .container{max-width:500px;margin:0 auto;padding:20px 16px 40px;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-bottom:16px;}
  .section-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .section-sub{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5;}
  .vin-wrap{display:flex;gap:10px;align-items: flex-start;}
  .vin-input{flex:1;padding:14px 16px;border:2px solid var(--border);border-radius:14px;font-family:"Inter",sans-serif;font-size:15px;font-weight:600;color:var(--text);letter-spacing:0.06em;text-transform:uppercase;outline:none;height: 54px;}
  .camera-btn-label {cursor: pointer;background: var(--blue);color: white;border-radius: 14px;display: flex;align-items: center;justify-content: center;height: 54px;width: 54px;flex-shrink: 0;}
  .vin-btn{padding:14px 18px;background:var(--blue);border:none;border-radius:14px;color:#fff;font-family:"Inter",sans-serif;font-weight:700;font-size:14px;cursor:pointer;height: 54px;}
  .info-box{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;}
  .info-box.visible{display:block;background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
  .info-box.error{display:block;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;}
</style>
</head>
<body>

<div class="header">
  <div class="header-text">
    <div class="header-sub">Výměna oleje – rezervace</div>
    <div class="header-sub-small">Dlouhá Loučka, Šumvaldská 59</div>
  </div>
</div>

<div class="container">
  <div id="card-vin" class="card">
    <div class="section-title">Zadejte VIN vozidla</div>
    <div class="section-sub">Vyfoťte VIN kód nebo ho vyberte z menu (Soubory).</div>
    
    <div class="vin-wrap">
      <input type="text" id="vin" class="vin-input" placeholder="TMB..." maxlength="17">
      
      <label for="vin-upload" class="camera-btn-label">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <input type="file" id="vin-upload" accept="image/*" style="display:none">
      </label>

      <button id="btn-check-vin" class="vin-btn" onclick="checkVIN()">Ověřit</button>
    </div>
    <div id="vin-status" class="info-box"></div>
  </div>

  <div id="card-auto" class="card" style="display:none">
    <div class="section-title">Nalezené vozidlo</div>
    <div id="auto-info-text" style="font-size:15px; font-weight:600; color:var(--blue); margin-bottom:10px;"></div>
  </div>
</div>

<script>
// TVOJE FUNKČNÍ ADRESA (vytáhl jsem ji z tvého kódu)
const OLEJE_API = 'https://script.google.com/macros/s/AKfycbzVv7T8Pq49m1K9YxS0Hh-0z7B8lEsCw/exec'; 
const VISION_API_KEY = 'AIzaSyDngFtfxDub3SR5zOrMYYbWw-z7B8lEsCw';

async function procesujObrazek(e) {
  const file = e.target.files[0];
  if (!file) return;

  const status = document.getElementById('vin-status');
  const vinInput = document.getElementById('vin');
  
  status.className = "info-box visible";
  status.textContent = "Analyzuji obrázek...";

  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = async () => {
    const base64 = reader.result.split(',')[1];
    try {
      const res = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${VISION_API_KEY}`, {
        method: 'POST',
        body: JSON.stringify({
          requests: [{
            image: { content: base64 },
            features: [{ type: 'TEXT_DETECTION' }]
          }]
        })
      });
      const data = await res.json();
      const text = data.responses[0]?.fullTextAnnotation?.text || "";
      const found = text.replace(/\s/g, '').match(/[A-HJ-NPR-Z0-9]{17}/);
      
      if (found) {
        vinInput.value = found[0];
        status.textContent = "VIN nalezen: " + found[0] + ". Probíhá ověření...";
        checkVIN();
      } else {
        status.className = "info-box error";
        status.textContent = "VIN nebyl na fotce rozpoznán.";
      }
    } catch (err) {
      status.className = "info-box error";
      status.textContent = "Chyba analýzy.";
    }
  };
}

document.getElementById('vin-upload').addEventListener('change', procesujObrazek);

function checkVIN() {
  const vinValue = document.getElementById('vin').value.trim().toUpperCase();
  const status = document.getElementById('vin-status');
  const cardAuto = document.getElementById('card-auto');
  const autoInfo = document.getElementById('auto-info-text');
  
  if (vinValue.length !== 17) {
    status.className = "info-box error";
    status.textContent = "VIN musí mít 17 znaků.";
    return;
  }

  status.className = "info-box visible";
  status.textContent = "Hledám v databázi...";

  fetch(`${OLEJE_API}?akce=getAuto&vin=${vinValue}`)
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        status.style.display = 'none';
        cardAuto.style.display = 'block';
        autoInfo.textContent = data.auto + " (" + data.spz + ")";
      } else {
        status.className = "info-box error";
        status.textContent = "Auto nenalezeno.";
      }
    })
    .catch(err => {
      status.className = "info-box error";
      status.textContent = "Chyba spojení s tabulkou.";
    });
}
</script>
</body>
</html>
