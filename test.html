<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test spojení</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; background:#f1f5f9; }
  h2 { font-size: 18px; }
  pre {
    background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px;
    white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.5;
  }
  button { padding:12px 18px; font-size:16px; border:none; border-radius:8px;
    background:#2563eb; color:#fff; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<h2>Test spojení s projektem</h2>
<button onclick="test()">Spustit test</button>
<pre id="out">Klikni na „Spustit test".</pre>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyqWoHAPxVAsB-qYeF40XmxM4hTy0cW7dqV4h8pQ-CdycTWGnNoo0Q2nIamqAYMY302-w/exec';

async function test(){
  const out = document.getElementById('out');
  out.textContent = 'Odesílám testovací požadavek...\n';
  const payload = {
    akce: 'uctenka_save',
    data: { dodavatel:'TEST', popis:'test spojeni', castka:'1', kategorie:'', fotoBase64:'', fotoTyp:'', fotoPripona:'' }
  };
  try {
    const res = await fetch(GAS_URL, { method:'POST', redirect:'follow', body: JSON.stringify(payload) });
    out.textContent += 'Stav odpovědi (HTTP status): ' + res.status + '\n';
    const text = await res.text();
    out.textContent += 'Surová odpověď serveru:\n----------\n' + text.slice(0, 2000) + '\n----------\n';
    try {
      const j = JSON.parse(text);
      out.textContent += '\nOdpověď je platný JSON. ok=' + j.ok + (j.id ? (', id='+j.id) : '') + (j.chyba ? (', chyba='+j.chyba) : '');
    } catch(e){
      out.textContent += '\nPOZOR: odpověď NENÍ JSON (server vrátil nejspíš chybovou HTML stránku — okénko doPost asi neběží v nasazené verzi).';
    }
  } catch(err){
    out.textContent += '\nSPOJENÍ SELHALO: ' + (err && err.message ? err.message : err);
    out.textContent += '\n(Tohle bývá blokované spojení — CORS nebo nasazení s přístupem ne pro „Anyone".)';
  }
}
</script>
</body>
</html>
