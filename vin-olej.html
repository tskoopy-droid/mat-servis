<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIN → Olej</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #e8c547;
    --text: #e8e8e8;
    --muted: #666;
    --red: #e05252;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container { width: 100%; max-width: 560px; }

  .header { margin-bottom: 32px; }
  .header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header p { font-size: 28px; font-weight: 700; }

  .input-group { position: relative; margin-bottom: 12px; }

  .input-group input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 120px 16px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: var(--muted); letter-spacing: 1px; font-size: 13px; }

  .btn {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 3px;
    padding: 8px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    height: 20px;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .status.loading { color: var(--accent); }
  .status.error { color: var(--red); }

  .result { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .result.visible { display: block; }

  .result-header {
    background: var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-header .vehicle { font-size: 13px; font-weight: 600; }
  .result-header .years { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); }

  .oil-main { padding: 20px 16px; border-bottom: 1px solid var(--border); }
  .oil-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .oil-name { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .oil-interval { font-size: 13px; color: var(--muted); }

  .specs { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid var(--border); }
  .spec { padding: 14px 16px; border-right: 1px solid var(--border); }
  .spec:last-child { border-right: none; }
  .spec-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
  .spec-value { font-size: 16px; font-weight: 700; }
  .spec-value span { font-size: 11px; font-weight: 400; color: var(--muted); }

  .alts { padding: 14px 16px; }
  .alts-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .alt-list { display: flex; flex-direction: column; gap: 6px; }
  .alt-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .alt-item .alt-interval { font-family: 'Space Mono', monospace; font-size: 10px; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>M&T Servis // Test</h1>
    <p>Olej podle VIN</p>
  </div>

  <div class="input-group">
    <input type="text" id="vin" placeholder="Zadej VIN kód..." maxlength="17" />
    <button class="btn" id="searchBtn" onclick="hledej()">HLEDAT</button>
  </div>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="result-header">
      <span class="vehicle" id="vehicleName"></span>
      <span class="years" id="vehicleYears"></span>
    </div>
    <div class="oil-main">
      <div class="oil-label">Doporučený olej</div>
      <div class="oil-name" id="oilName"></div>
      <div class="oil-interval" id="oilInterval"></div>
    </div>
    <div class="specs">
      <div class="spec">
        <div class="spec-label">Objem</div>
        <div class="spec-value" id="oilVolume">— <span>l</span></div>
      </div>
      <div class="spec">
        <div class="spec-label">Kód motoru</div>
        <div class="spec-value" id="engineCode">—</div>
      </div>
      <div class="spec">
        <div class="spec-label">Interval</div>
        <div class="spec-value" id="oilKm">— <span>km</span></div>
      </div>
    </div>
    <div class="alts">
      <div class="alts-label">Alternativy</div>
      <div class="alt-list" id="altList"></div>
    </div>
  </div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbztDbYh8df3_sE_PLFkg75VCxmw9gaDfraj72ulveGb4StgJO_ZdwHJdK2m6fXvRF5pNg/exec';

async function hledej() {
  const vin = document.getElementById('vin').value.trim().toUpperCase();
  if (vin.length < 10) { setStatus('VIN je příliš krátký', 'error'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  setStatus('Hledám...', 'loading');
  document.getElementById('result').classList.remove('visible');

  try {
    const r = await fetch(`${GAS_URL}?vin=${vin}&action=olej`);
    const data = await r.json();

    if (data.error) {
      setStatus(data.error === 'not_found' ? 'Vozidlo nenalezeno v databázi Castrol' : 'Chyba: ' + data.error, 'error');
      btn.disabled = false;
      return;
    }

    const motor = data.components.find(c => c.name === 'Motor');
    if (!motor) { setStatus('Data o motoru nenalezena', 'error'); btn.disabled = false; return; }

    const prod = motor.recommendedProduct;
    const objem = motor.vehicleComponentVolumes?.[0]?.value || '—';
    const interval = prod?.serviceIntervals?.[0]?.name || '—';
    const km = interval.match(/(\d+)\s*km/)?.[1] || '—';

    document.getElementById('vehicleName').textContent = `${data.vehicle.make} ${data.vehicle.model} — ${data.vehicle.type}`;
    document.getElementById('vehicleYears').textContent = `${data.vehicle.yearFrom}–${data.vehicle.yearTo}`;
    document.getElementById('oilName').textContent = prod?.name || '—';
    document.getElementById('oilInterval').textContent = interval;
    document.getElementById('oilVolume').innerHTML = `${objem} <span>l</span>`;
    document.getElementById('engineCode').textContent = motor.code || '—';
    document.getElementById('oilKm').innerHTML = `${km !== '—' ? Number(km).toLocaleString('cs') : '—'} <span>km</span>`;

    const altList = document.getElementById('altList');
    altList.innerHTML = '';
    (motor.alternateProducts || []).slice(0, 4).forEach(alt => {
      const div = document.createElement('div');
      div.className = 'alt-item';
      const intv = alt.serviceIntervals?.[0]?.name || '';
      div.innerHTML = `<span>${alt.name}</span><span class="alt-interval">${intv}</span>`;
      altList.appendChild(div);
    });

    document.getElementById('result').classList.add('visible');
    setStatus('', '');

  } catch(err) {
    setStatus('Chyba spojení', 'error');
  }

  btn.disabled = false;
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (type || '');
}

document.getElementById('vin').addEventListener('keydown', e => {
  if (e.key === 'Enter') hledej();
});
</script>
</body>
</html>
